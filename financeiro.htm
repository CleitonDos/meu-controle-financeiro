<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💰 Meu Controle Financeiro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { font-family: 'Segoe UI', 'Inter', system-ui, sans-serif; }

        body {
            background: #0b0b12;
            min-height: 100vh;
            padding: 20px;
            background-image: radial-gradient(circle at 20% 30%, rgba(79, 172, 254, 0.04) 0%, transparent 60%),
                              radial-gradient(circle at 80% 70%, rgba(220, 50, 50, 0.04) 0%, transparent 60%);
        }

        .container-fluid {
            background: #141425 !important;
            border-radius: 20px !important;
            border: 1px solid #2a2a4a !important;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7), 0 0 40px rgba(79, 172, 254, 0.03) !important;
            padding: 28px 30px !important;
            max-width: 1300px;
            margin: 0 auto;
        }

        .topo-titulo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .titulo-controle {
            color: #ffffff;
            font-size: 26px;
            font-weight: 700;
            padding-left: 16px;
            border-left: 6px solid transparent;
            border-image: linear-gradient(180deg, #4facfe, #dc3545) 1;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .titulo-controle i {
            background: linear-gradient(135deg, #4facfe, #dc3545);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 30px;
        }
        .titulo-controle span {
            background: linear-gradient(135deg, #4facfe, #dc3545);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .btn-novo {
            background: linear-gradient(135deg, #4facfe, #2c7ef7);
            color: white;
            border: none;
            padding: 10px 22px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-novo:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(79, 172, 254, 0.25);
        }

        /* ============================================
           CARDS DE TOTAIS - AJUSTADOS
           ============================================ */
        .card-total {
            background: #1c1c34;
            border: 1px solid #2a2a4a;
            border-radius: 14px;
            padding: 14px 10px;
            text-align: center;
            transition: 0.3s;
            height: 100%;
            overflow: hidden;
        }
        .card-total:hover {
            border-color: #4facfe;
            box-shadow: 0 0 25px rgba(79, 172, 254, 0.06);
            transform: translateY(-2px);
        }
        .card-total .rotulo {
            color: #8a8ab0;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }
        .card-total .valor {
            font-size: 17px;
            font-weight: 700;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card-total .valor.entrada { color: #4ade80; }
        .card-total .valor.saida { color: #dc3545; }
        .card-total .valor.saldo { color: #4facfe; }
        .card-total .icone {
            font-size: 18px;
            margin-bottom: 4px;
            display: block;
        }
        .card-total .icone.entrada { color: #4ade80; }
        .card-total .icone.saida { color: #dc3545; }
        .card-total .icone.saldo { color: #4facfe; }

        /* ============================================
           FILTROS - COMPACTOS
           ============================================ */
        .filtros-area {
            background: #1c1c34;
            border-radius: 14px;
            padding: 16px 20px;
            border: 1px solid #2a2a4a;
            height: 100%;
        }
        .filtros-area .form-label {
            color: #8a8ab0;
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }
        .filtros-area .form-select,
        .filtros-area .form-control {
            background: #0b0b15;
            border: 1px solid #2d2d50;
            color: #e0e0f0;
            font-size: 13px;
            border-radius: 8px;
            padding: 7px 10px;
            cursor: pointer;
            width: 100%;
        }
        .filtros-area .form-select:focus,
        .filtros-area .form-control:focus {
            border-color: #4facfe;
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.08);
            background: #0b0b15;
            color: #e0e0f0;
        }
        .filtros-area .form-select option {
            background: #141425;
            color: #e0e0f0;
        }

        /* FORM NOVO LANÇAMENTO */
        .form-novo {
            display: none;
            background: #1c1c34;
            border: 1px solid #2a2a4a;
            border-left: 4px solid #4ade80;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .form-novo.ativo { display: block; }
        .form-novo h5 {
            color: #ffffff;
            font-weight: 600;
            margin-bottom: 16px;
            font-size: 16px;
        }
        .form-novo input,
        .form-novo select {
            background: #0b0b15;
            border: 1px solid #2d2d50;
            color: #e0e0f0;
            font-size: 14px;
            border-radius: 8px;
            padding: 9px 12px;
            width: 100%;
        }
        .form-novo input:focus,
        .form-novo select:focus {
            border-color: #4facfe;
            outline: none;
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.08);
        }
        .form-novo input::placeholder { color: #5a5a7a; }
        .btn-salvar-form {
            background: linear-gradient(135deg, #4ade80, #22c55e);
            color: #0b0b12;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-salvar-form:hover { transform: translateY(-2px); }

        /* TABELA */
        .table-responsive {
            border-radius: 14px;
            border: 1px solid #2a2a4a;
            overflow: hidden;
            margin-top: 16px;
            background: #10101f;
        }
        .table {
            margin-bottom: 0;
            font-size: 14px;
            background: #10101f;
        }
        .table thead th {
            background: #1c1c34;
            color: #4facfe;
            text-transform: uppercase;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
            padding: 14px 16px;
            border-bottom: 2px solid #2f2f52;
            border-color: #2a2a4a;
        }
        .table tbody td {
            padding: 12px 16px;
            vertical-align: middle;
            border-color: #1e1e36;
            color: #d4d4f0;
            background: #10101f;
        }
        .table tbody tr {
            background: #10101f;
            transition: 0.2s;
        }
        .table tbody tr:hover { background: rgba(79, 172, 254, 0.04); }

        .table tbody tr.linha-entrada {
            background: rgba(74, 222, 128, 0.04);
            border-left: 3px solid #4ade80;
        }
        .table tbody tr.linha-entrada td {
            color: #4ade80 !important;
            background: rgba(74, 222, 128, 0.02);
        }
        .table tbody tr.linha-entrada:hover td { background: rgba(74, 222, 128, 0.06); }

        .table tbody tr.linha-saida {
            background: rgba(220, 53, 69, 0.04);
            border-left: 3px solid #dc3545;
        }
        .table tbody tr.linha-saida td {
            color: #dc3545 !important;
            background: rgba(220, 53, 69, 0.02);
        }
        .table tbody tr.linha-saida:hover td { background: rgba(220, 53, 69, 0.06); }

        .badge-tipo {
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
        }
        .badge-tipo.entrada {
            background: rgba(74, 222, 128, 0.15);
            color: #4ade80;
        }
        .badge-tipo.saida {
            background: rgba(220, 53, 69, 0.15);
            color: #dc3545;
        }

        .obs-icon { color: #5a5a7a; font-size: 14px; cursor: help; }
        .obs-icon:hover { color: #8a8ab0; }

        .btn-acao {
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 14px;
            transition: 0.2s;
            text-decoration: none;
            display: inline-block;
        }
        .btn-acao-edit { color: #4facfe; }
        .btn-acao-edit:hover { background: rgba(79, 172, 254, 0.1); color: #7fc4ff; }
        .btn-acao-del { color: #dc3545; }
        .btn-acao-del:hover { background: rgba(220, 53, 69, 0.1); color: #ff5566; }

        .rodape-info { color: #6a6a8a; font-size: 13px; }
        .rodape-info i { color: #4facfe; }

        /* MODAL */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }
        .modal-overlay.ativo { display: flex; }
        .modal-box {
            background: #141425;
            border: 1px solid #2a2a4a;
            border-radius: 16px;
            padding: 26px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }
        .modal-box h4 {
            color: #ffffff;
            margin-bottom: 18px;
            font-size: 18px;
        }
        .modal-box h4 i { color: #4facfe; }
        .modal-box form { display: grid; gap: 10px; }
        .modal-box input,
        .modal-box select {
            background: #0b0b15;
            border: 1px solid #2d2d50;
            color: #e0e0f0;
            font-size: 14px;
            border-radius: 8px;
            padding: 9px 12px;
        }
        .modal-box input:focus,
        .modal-box select:focus {
            border-color: #4facfe;
            outline: none;
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.08);
        }
        .botoes-modal { display: flex; gap: 10px; margin-top: 6px; }
        .botoes-modal button {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }
        .btn-modal-salvar {
            background: linear-gradient(135deg, #4facfe, #2c7ef7);
            color: white;
        }
        .btn-modal-cancelar {
            background: #2a2a4a;
            color: #d4d4f0;
        }

        @media (max-width: 768px) {
            .container-fluid { padding: 16px !important; }
            .titulo-controle { font-size: 20px; }
            .card-total .valor { font-size: 15px; }
            .table { font-size: 13px; }
            .table thead th, .table tbody td { padding: 8px 10px; }
        }
        @media (max-width: 576px) {
            .titulo-controle { font-size: 17px; padding-left: 10px; }
            .card-total .valor { font-size: 13px; }
            .container-fluid { padding: 12px !important; border-radius: 14px !important; }
            .table { font-size: 12px; }
            .table thead th, .table tbody td { padding: 6px 8px; }
        }
    </style>
</head>
<body>

    <div class="container-fluid">

        <!-- TÍTULO + BOTÃO NOVO -->
        <div class="topo-titulo">
            <div class="titulo-controle">
                <i class="fas fa-wallet"></i>
                <span>Meu Controle Financeiro</span>
            </div>
            <button class="btn-novo" onclick="toggleFormNovo()">
                <i class="fas fa-plus"></i> Novo Lançamento
            </button>
        </div>

        <!-- FORM NOVO LANÇAMENTO -->
        <div class="form-novo" id="formNovo">
            <h5><i class="fas fa-plus-circle"></i> Novo Lançamento</h5>
            <form action="/salvar" method="POST">
                <div class="row g-2">
                    <div class="col-6 col-md-2">
                        <input type="date" name="data" required>
                    </div>
                    <div class="col-6 col-md-2">
                        <select name="banco" required>
                            <option value="">Banco...</option>
                            <option value="Caixa">Caixa</option>
                            <option value="Nubank">Nubank</option>
                            <option value="Banco do Brasil">Banco do Brasil</option>
                            <option value="Itaú">Itaú</option>
                            <option value="Bradesco">Bradesco</option>
                            <option value="Inter">Inter</option>
                            <option value="C6 Bank">C6 Bank</option>
                        </select>
                    </div>
                    <div class="col-6 col-md-2">
                        <select name="tipo" required>
                            <option value="">Tipo...</option>
                            <option value="Entrada">Entrada</option>
                            <option value="Saída">Saída</option>
                        </select>
                    </div>
                    <div class="col-6 col-md-2">
                        <input type="text" name="descricao" placeholder="Descrição" required>
                    </div>
                    <div class="col-6 col-md-2">
                        <input type="text" name="valor" placeholder="Valor (ex: 150.50)" required>
                    </div>
                    <div class="col-6 col-md-2">
                        <input type="text" name="observacao" placeholder="Observação">
                    </div>
                </div>
                <div class="mt-3 d-flex gap-2 justify-content-end">
                    <button type="button" class="btn-modal-cancelar" style="padding: 9px 20px; border:none; border-radius:8px; cursor:pointer; font-weight:600;" onclick="toggleFormNovo()">Cancelar</button>
                    <button type="submit" class="btn-salvar-form" style="padding: 9px 24px;">
                        <i class="fas fa-check"></i> Salvar
                    </button>
                </div>
            </form>
        </div>

        <!-- TOTAIS + FILTROS -->
        <div class="row g-3 align-items-stretch mb-4">

            <!-- TOTAIS (mais largos) -->
            <div class="col-12 col-lg-5">
                <div class="row g-2">
                    <div class="col-4">
                        <div class="card-total">
                            <span class="icone entrada"><i class="fas fa-arrow-down"></i></span>
                            <span class="rotulo">Entrada</span>
                            <div class="valor entrada" id="displayEntrada"><!--TOTAL_ENTRADA--></div>
                        </div>
                    </div>
                    <div class="col-4">
                        <div class="card-total">
                            <span class="icone saida"><i class="fas fa-arrow-up"></i></span>
                            <span class="rotulo">Saída</span>
                            <div class="valor saida" id="displaySaida"><!--TOTAL_SAIDA--></div>
                        </div>
                    </div>
                    <div class="col-4">
                        <div class="card-total">
                            <span class="icone saldo"><i class="fas fa-scale-balanced"></i></span>
                            <span class="rotulo">Saldo Atual</span>
                            <div class="valor saldo" id="displaySaldo"><!--TOTAL_SALDO--></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- FILTROS (mais compactos) -->
            <div class="col-12 col-lg-7">
                <div class="filtros-area">
                    <div class="row g-2">
                        <div class="col-3">
                            <label class="form-label"><i class="fas fa-university me-1"></i> Banco</label>
                            <select class="form-select form-select-sm" id="filtroBanco" onchange="aplicarFiltros()">
                                <option value="Todos">Todos</option>
                                <option value="Caixa">Caixa</option>
                                <option value="Nubank">Nubank</option>
                                <option value="Banco do Brasil">Banco do Brasil</option>
                                <option value="Itaú">Itaú</option>
                                <option value="Bradesco">Bradesco</option>
                                <option value="Inter">Inter</option>
                                <option value="C6 Bank">C6 Bank</option>
                            </select>
                        </div>

                        <div class="col-3">
                            <label class="form-label"><i class="fas fa-tag me-1"></i> Tipo</label>
                            <select class="form-select form-select-sm" id="filtroTipo" onchange="aplicarFiltros()">
                                <option value="Todos">Todos</option>
                                <option value="Entrada">Entrada</option>
                                <option value="Saída">Saída</option>
                            </select>
                        </div>

                        <div class="col-3">
                            <label class="form-label"><i class="fas fa-calendar me-1"></i> Ano</label>
                            <select class="form-select form-select-sm" id="filtroAno" onchange="aplicarFiltros()">
                                <option value="Todos">Todos</option>
                                <option value="2024">2024</option>
                                <option value="2025">2025</option>
                                <option value="2026">2026</option>
                                <option value="2027">2027</option>
                            </select>
                        </div>

                        <div class="col-3">
                            <label class="form-label"><i class="fas fa-calendar-alt me-1"></i> Mês</label>
                            <select class="form-select form-select-sm" id="filtroMes" onchange="aplicarFiltros()">
                                <option value="Todos">Todos</option>
                                <option value="01">Janeiro</option>
                                <option value="02">Fevereiro</option>
                                <option value="03">Março</option>
                                <option value="04">Abril</option>
                                <option value="05">Maio</option>
                                <option value="06">Junho</option>
                                <option value="07">Julho</option>
                                <option value="08">Agosto</option>
                                <option value="09">Setembro</option>
                                <option value="10">Outubro</option>
                                <option value="11">Novembro</option>
                                <option value="12">Dezembro</option>
                            </select>
                        </div>
                    </div>
                    <div class="mt-2 d-flex justify-content-between align-items-center flex-wrap gap-2">
                        <button onclick="limparFiltros()" style="background:#2a2a4a; color:#d4d4f0; border:none; padding:6px 14px; border-radius:8px; cursor:pointer; font-size:13px;">
                            <i class="fas fa-eraser"></i> Limpar Filtros
                        </button>
                        <span style="color:#8a8ab0; font-size:13px;">Registros: <b id="qtdRegistros" style="color:#4facfe;">0</b></span>
                    </div>
                </div>
            </div>

        </div>

        <!-- TABELA -->
        <div class="table-responsive">
            <table class="table">
                <thead>
                    <tr>
                        <th><i class="fas fa-calendar-day me-1"></i> Data</th>
                        <th><i class="fas fa-university me-1"></i> Banco</th>
                        <th><i class="fas fa-tag me-1"></i> Tipo</th>
                        <th><i class="fas fa-align-left me-1"></i> Descrição</th>
                        <th class="text-end"><i class="fas fa-dollar-sign me-1"></i> Valor</th>
                        <th class="text-end"><i class="fas fa-wallet me-1"></i> Saldo</th>
                        <th><i class="fas fa-pen me-1"></i> Obs.</th>
                        <th class="text-center"><i class="fas fa-cog me-1"></i> Ações</th>
                    </tr>
                </thead>
                <tbody id="corpoTabela">
                    <!--DADOS_TABELA-->
                </tbody>
            </table>
        </div>

        <!-- RODAPÉ -->
        <div class="row mt-3">
            <div class="col-12">
                <div class="rodape-info d-flex justify-content-end align-items-center gap-3 flex-wrap">
                    <span><i class="fas fa-database me-1"></i> <span id="qtdRodape">0</span> registros</span>
                    <span><i class="fas fa-rotate me-1"></i> Última atualização: hoje</span>
                </div>
            </div>
        </div>

    </div>

    <!-- MODAL EDIÇÃO -->
    <div class="modal-overlay" id="modalEditar">
        <div class="modal-box">
            <h4><i class="fas fa-pen-to-square"></i> Editar Lançamento</h4>
            <form action="/editar" method="POST">
                <input type="hidden" name="id" id="editId">
                <input type="date" name="data" id="editData" required>
                <select name="banco" id="editBanco" required>
                    <option value="Caixa">Caixa</option>
                    <option value="Nubank">Nubank</option>
                    <option value="Banco do Brasil">Banco do Brasil</option>
                    <option value="Itaú">Itaú</option>
                    <option value="Bradesco">Bradesco</option>
                    <option value="Inter">Inter</option>
                    <option value="C6 Bank">C6 Bank</option>
                </select>
                <select name="tipo" id="editTipo" required>
                    <option value="Entrada">Entrada</option>
                    <option value="Saída">Saída</option>
                </select>
                <input type="text" name="descricao" id="editDescricao" placeholder="Descrição" required>
                <input type="text" name="valor" id="editValor" placeholder="Valor" required>
                <input type="text" name="observacao" id="editObservacao" placeholder="Observação">
                <div class="botoes-modal">
                    <button type="submit" class="btn-modal-salvar">Salvar</button>
                    <button type="button" class="btn-modal-cancelar" onclick="fecharModal()">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function toggleFormNovo() {
            document.getElementById("formNovo").classList.toggle("ativo");
        }

        function abrirModalEditar(id, data, banco, tipo, desc, valor, obs) {
            document.getElementById("editId").value = id;
            document.getElementById("editData").value = data;
            document.getElementById("editBanco").value = banco;
            document.getElementById("editTipo").value = tipo;
            document.getElementById("editDescricao").value = desc;
            document.getElementById("editValor").value = valor;
            document.getElementById("editObservacao").value = obs;
            document.getElementById("modalEditar").classList.add("ativo");
        }
        function fecharModal() {
            document.getElementById("modalEditar").classList.remove("ativo");
        }

        function carregarFiltrosSalvos() {
            const banco = localStorage.getItem("filtro_banco");
            const tipo = localStorage.getItem("filtro_tipo");
            const ano = localStorage.getItem("filtro_ano");
            const mes = localStorage.getItem("filtro_mes");
            if (banco !== null) document.getElementById("filtroBanco").value = banco;
            if (tipo !== null) document.getElementById("filtroTipo").value = tipo;
            if (ano !== null) document.getElementById("filtroAno").value = ano;
            if (mes !== null) document.getElementById("filtroMes").value = mes;
        }

        function salvarFiltrosNaMemoria() {
            localStorage.setItem("filtro_banco", document.getElementById("filtroBanco").value);
            localStorage.setItem("filtro_tipo", document.getElementById("filtroTipo").value);
            localStorage.setItem("filtro_ano", document.getElementById("filtroAno").value);
            localStorage.setItem("filtro_mes", document.getElementById("filtroMes").value);
        }

        function limparFiltros() {
            localStorage.removeItem("filtro_banco");
            localStorage.removeItem("filtro_tipo");
            localStorage.removeItem("filtro_ano");
            localStorage.removeItem("filtro_mes");
            document.getElementById("filtroBanco").value = "Todos";
            document.getElementById("filtroTipo").value = "Todos";
            document.getElementById("filtroAno").value = "Todos";
            document.getElementById("filtroMes").value = "Todos";
            aplicarFiltros();
        }

        function aplicarFiltros() {
            salvarFiltrosNaMemoria();
            const bancoFiltro = document.getElementById("filtroBanco").value.toLowerCase();
            const tipoFiltro = document.getElementById("filtroTipo").value.toLowerCase();
            const anoFiltro = document.getElementById("filtroAno").value;
            const mesFiltro = document.getElementById("filtroMes").value;

            const linhas = document.querySelectorAll("#corpoTabela tr");
            let totalEntrada = 0.0, totalSaida = 0.0, registrosVisiveis = 0;

            linhas.forEach(linha => {
                const colunas = linha.querySelectorAll("td");
                if (colunas.length < 6) return;
                const dataTexto = colunas[0].textContent.trim();
                const bancoTexto = colunas[1].textContent.trim().toLowerCase();
                const tipoTexto = colunas[2].textContent.trim().toLowerCase();

                let anoData = "", mesData = "";
                if (dataTexto.includes("/")) {
                    const p = dataTexto.split("/");
                    if (p.length === 3) { mesData = p[1]; anoData = p[2]; }
                } else if (dataTexto.includes("-")) {
                    const p = dataTexto.split("-");
                    anoData = p[0] || ""; mesData = p[1] || "";
                }

                const valorTexto = colunas[4].textContent.replace("R$", "").replace(/\./g, "").replace(",", ".").trim();
                const valor = parseFloat(valorTexto) || 0;

                const atendeBanco = !bancoFiltro || bancoFiltro === "todos" || bancoTexto.includes(bancoFiltro);
                const atendeTipo = !tipoFiltro || tipoFiltro === "todos" || tipoTexto.includes(tipoFiltro);
                const atendeAno = !anoFiltro || anoFiltro === "todos" || anoData === anoFiltro;
                const atendeMes = !mesFiltro || mesFiltro === "todos" || mesData === mesFiltro;

                if (atendeBanco && atendeTipo && atendeAno && atendeMes) {
                    linha.style.display = "";
                    registrosVisiveis++;
                    if (tipoTexto.includes("entrada") || tipoTexto.includes("receita")) totalEntrada += valor;
                    else if (tipoTexto.includes("saída") || tipoTexto.includes("saida")) totalSaida += valor;
                } else {
                    linha.style.display = "none";
                }
            });

            document.getElementById("displayEntrada").textContent = `R$ ${totalEntrada.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}`;
            document.getElementById("displaySaida").textContent = `R$ ${totalSaida.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}`;
            document.getElementById("displaySaldo").textContent = `R$ ${(totalEntrada - totalSaida).toLocaleString('pt-BR', { minimumFractionDigits: 2 })}`;
            document.getElementById("qtdRegistros").textContent = registrosVisiveis;
            const elRodape = document.getElementById("qtdRodape");
            if (elRodape) elRodape.textContent = registrosVisiveis;
        }

        window.addEventListener("DOMContentLoaded", () => {
            carregarFiltrosSalvos();
            aplicarFiltros();
        });
    </script>
</body>
</html>
