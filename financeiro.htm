<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle Financeiro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card-stats { border-left: 4px solid #0d6efd; }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h2 class="mb-4">Controle Financeiro</h2>

        <!-- Cards de Totais -->
        <div class="row mb-4">
            <div class="col-md-4">
                <div class="card card-stats shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title text-muted">Total Entrada</h5>
                        <h3 id="displayEntrada" class="text-success">R$ 0,00</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card card-stats shadow-sm" style="border-left-color: #dc3545;">
                    <div class="card-body">
                        <h5 class="card-title text-muted">Total Saída</h5>
                        <h3 id="displaySaida" class="text-danger">R$ 0,00</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card card-stats shadow-sm" style="border-left-color: #ffc107;">
                    <div class="card-body">
                        <h5 class="card-title text-muted">Saldo Atual</h5>
                        <h3 id="displaySaldo" class="text-primary">R$ 0,00</h3>
                    </div>
                </div>
            </div>
        </div>

        <!-- Filtros -->
        <div class="card mb-4 shadow-sm">
            <div class="card-body">
                <h5 class="card-title mb-3">Filtros</h5>
                <div class="row g-3">
                    <div class="col-md-3">
                        <label for="filtroBanco" class="form-label">Banco</label>
                        <select id="filtroBanco" class="form-select" onchange="aplicarFiltros()">
                            <option value="">Todos</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label for="filtroTipo" class="form-label">Tipo</label>
                        <select id="filtroTipo" class="form-select" onchange="aplicarFiltros()">
                            <option value="">Todos</option>
                            <option value="entrada">Entrada</option>
                            <option value="saida">Saída</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label for="filtroAno" class="form-label">Ano</label>
                        <select id="filtroAno" class="form-select" onchange="aplicarFiltros()">
                            <option value="">Todos</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label for="filtroMes" class="form-label">Mês</label>
                        <select id="filtroMes" class="form-select" onchange="aplicarFiltros()">
                            <option value="">Todos</option>
                            <option value="01">Janeiro</option>
                            <option value="02">Fevereiro</option>
                            <option value="03">Março</option>
                            <option value="04">Abril</option>
                            <option value="05">Maio</option>
                            <option value="06">Junho</option>
                            <option value="07">Julho</option>
                            <option value="08">Agosto</option>
                            <option value="09">Setembro</option>
                            <option value="10">Outubro</option>
                            <option value="11">Novembro</option>
                            <option value="12">Dezembro</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tabela -->
        <div class="card shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped align-middle">
                        <thead>
                            <tr>
                                <th>Data</th>
                                <th>Banco</th>
                                <th>Tipo</th>
                                <th>Valor</th>
                            </tr>
                        </thead>
                        <tbody id="corpoTabela">
                            <!-- Insira as linhas da tabela com os atributos data-banco, data-tipo, data-data e data-valor aqui -->
                        </tbody>
                    </table>
                </div>
                <div class="mt-3 text-muted">
                    Mostrando <span id="qtdRegistros">0</span> registros visíveis.
                </div>
            </div>
        </div>
    </div>

    <script>
        function salvarFiltrosNaMemoria() {
            // Lógica opcional para persistir filtros
        }

        function aplicarFiltros() {
            salvarFiltrosNaMemoria();

            const bancoFiltro = document.getElementById("filtroBanco").value.toLowerCase();
            const tipoFiltro = document.getElementById("filtroTipo").value.toLowerCase();
            const anoFiltro = document.getElementById("filtroAno").value;
            const mesFiltro = document.getElementById("filtroMes").value;

            const linhas = document.querySelectorAll("#corpoTabela tr");
            let totalEntrada = 0.0;
            let totalSaida = 0.0;
            let registrosVisiveis = 0;

            linhas.forEach(linha => {
                const banco = (linha.getAttribute("data-banco") || "").toLowerCase();
                const tipo = (linha.getAttribute("data-tipo") || "").toLowerCase();
                const data = linha.getAttribute("data-data") || "";
                const valor = parseFloat(linha.getAttribute("data-valor") || "0");

                const partes = data.split("-");
                const ano = partes[0];
                const mes = partes[1];

                const matchBanco = !bancoFiltro || banco === bancoFiltro;
                const matchTipo = !tipoFiltro || tipo === tipoFiltro;
                const matchAno = !anoFiltro || ano === anoFiltro;
                const matchMes = !mesFiltro || mes === mesFiltro;

                if (matchBanco && matchTipo && matchAno && matchMes) {
                    linha.style.display = "";
                    registrosVisiveis++;

                    if (tipo === "entrada") {
                        totalEntrada += valor;
                    } else if (tipo === "saída" || tipo === "saida") {
                        totalSaida += valor;
                    }
                } else {
                    linha.style.display = "none";
                }
            });

            // Calcula o saldo (Entradas - Saídas) com base nos filtros aplicados
            let saldoAtual = totalEntrada - totalSaida;

            // Atualiza os elementos visuais dos cartões no topo mantendo o design original
            document.getElementById("displayEntrada").innerText = "R$ " + totalEntrada.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            document.getElementById("displaySaida").innerText = "R$ " + totalSaida.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            
            const elSaldo = document.getElementById("displaySaldo");
            elSaldo.innerText = "R$ " + saldoAtual.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            
            // Ajusta a cor do saldo com classes padrão
            if (saldoAtual < 0) {
                elSaldo.className = "valor saldo text-danger";
            } else {
                elSaldo.className = "valor saldo text-primary";
            }

            // Atualiza a quantidade de registros no rodapé
            const qtdReg = document.getElementById("qtdRegistros");
            if (qtdReg) qtdReg.innerText = registrosVisiveis;
        }

        // Executa na carga inicial
        window.onload = function() {
            aplicarFiltros();
        };
    </script>
</body>
</html>
